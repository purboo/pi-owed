name: publish

# Publishes to npm when a version tag (v*) is pushed. npm trusted publishing:
# the job authenticates with a GitHub OIDC token (id-token: write); there is no
# npm token and no repository secret. Trusted publishing needs npm >= 11.5, and
# the npm bundled with Node 24 may be older, so npm is upgraded first.
# After a successful publish, a separate job creates the GitHub Release and
# records a deployment linking the npm version. Keeping its environment and
# contents: write permission separate preserves the publishing job's OIDC claims.
#
# `workflow_dispatch` runs the `maintenance` job only: it unpublishes a version
# inside npm's 72 hour window or deprecates one, both of which a token cannot do
# (npm refuses publish-affecting calls from bypass-2FA granular tokens, and this
# package requires 2FA to publish). Same file name, so the trusted-publisher
# claim npm recorded still matches.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      mode:
        description: 'unpublish or deprecate'
        type: choice
        options: [deprecate, unpublish]
        default: deprecate
      versions:
        description: 'Space separated versions, e.g. "0.33.0 0.33.1"'
        required: true
      message:
        description: 'Deprecation message (deprecate only)'
        required: false
        default: 'Superseded; please upgrade to the latest version'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Upgrade npm (trusted publishing needs npm >= 11.5)
        run: npm install -g npm@11
      - run: npm publish --access public

  release:
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: npm
      url: https://www.npmjs.com/package/pi-owed/v/${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME"; then
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          notes="$RUNNER_TEMP/pi-owed-release-notes.txt"
          awk -v heading="## $version" '
            $0 == heading { section = 1; next }
            section && /^## / { exit }
            section { print }
          ' CHANGELOG.md > "$notes"
          if ! awk '/[^[:space:]]/ { found = 1; exit } END { exit !found }' "$notes"; then
            echo 'See CHANGELOG.md.' > "$notes"
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "pi-owed $version" --notes-file "$notes"

  maintenance:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # the OIDC token npm exchanges for a short-lived maintenance credential
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11
      - name: ${{ inputs.mode }}
        env:
          MODE: ${{ inputs.mode }}
          PKG: pi-owed
          VERSIONS: ${{ inputs.versions }}
          MESSAGE: ${{ inputs.message }}
        run: |
          name="$PKG"
          latest="$(npm view "$name" dist-tags.latest)"
          for v in $VERSIONS; do
            if [ "$v" = "$latest" ]; then echo "::warning::skipping latest $v"; continue; fi
            if [ "$MODE" = "unpublish" ]; then
              npm unpublish "$name@$v" --force --loglevel verbose
            else
              npm deprecate "$name@$v" "$MESSAGE"
            fi
            echo "::notice::$MODE $name@$v done"
          done
